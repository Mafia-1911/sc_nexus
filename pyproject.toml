[project]
name = "cportal"
version = "0.1.0"
description = "ShipperFast (codename Cportal): supply-chain resilience for the Chattogram-Dhaka corridor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cportal-api",
    "cportal-c1",
    "cportal-c2",
    "cportal-c3",
    "cportal-c4",
    "cportal-core",
    "cportal-nexus",
    "cportal-connectors",
    "cportal-sim",
    "cportal-worker",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
    "types-shapely>=2.0",
]

[tool.uv]
# The repo lives on an NTFS drive; hardlinks from the uv cache (another filesystem) fail.
link-mode = "copy"

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/worker"]

[tool.uv.sources]
cportal-core = { workspace = true }
cportal-c1 = { workspace = true }
cportal-c2 = { workspace = true }
cportal-c3 = { workspace = true }
cportal-c4 = { workspace = true }
cportal-nexus = { workspace = true }
cportal-connectors = { workspace = true }
cportal-sim = { workspace = true }
cportal-api = { workspace = true }
cportal-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Never let `ruff format` touch Markdown code blocks (the brief is read-only).
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic characters used on purpose in user-facing text.
allowed-confusables = ["–", "×", "’", "‘", "σ"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations: long DDL lines are fine.
"db/alembic/versions/*" = ["E501"]
# Connector classes are single instances whose class attributes are declarative config.
"packages/connectors/src/cportal_connectors/sources/*" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
files = ["packages/core/src", "packages/connectors/src", "packages/sim/src", "packages/c1_supplier_graph/src", "packages/c2_trade_news/src", "packages/c3_routing/src", "packages/c4_port_dwell/src", "packages/nexus/src", "apps/api/src", "apps/worker/src"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["genson.*", "feedparser.*", "searoute.*", "openpyxl.*", "simpy.*", "pdfplumber.*", "apscheduler.*", "networkx.*", "scipy.*", "osmium.*", "mapie.*", "sksurv.*", "sklearn.*", "joblib.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pyrefly]
# Editors running pyrefly don't follow uv's editable-install .pth files.
search-path = ["packages/core/src", "packages/connectors/src", "packages/sim/src", "packages/c1_supplier_graph/src", "packages/c2_trade_news/src", "packages/c3_routing/src", "packages/c4_port_dwell/src", "packages/nexus/src", "apps/api/src", "apps/worker/src"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/connectors/tests", "packages/sim/tests", "packages/c1_supplier_graph/tests", "packages/c2_trade_news/tests", "packages/c3_routing/tests", "packages/c4_port_dwell/tests", "packages/nexus/tests", "apps/api/tests", "apps/worker/tests", "tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

# Package boundaries (02 §4 import rule): capability packages (c1…c5) import only core.
[tool.importlinter]
root_packages = ["cportal_core", "cportal_connectors", "cportal_sim", "cportal_c1", "cportal_c2", "cportal_c3", "cportal_c4", "cportal_nexus", "cportal_api", "cportal_worker"]

[[tool.importlinter.contracts]]
name = "core is the shared kernel and imports no other Cportal package"
type = "forbidden"
source_modules = ["cportal_core"]
forbidden_modules = ["cportal_connectors", "cportal_sim", "cportal_c1", "cportal_c2", "cportal_c3", "cportal_c4", "cportal_api"]

[[tool.importlinter.contracts]]
name = "connectors import only core"
type = "forbidden"
source_modules = ["cportal_connectors"]
forbidden_modules = ["cportal_sim", "cportal_api"]

[[tool.importlinter.contracts]]
name = "capability packages import only core (02 §4)"
type = "forbidden"
source_modules = ["cportal_c1", "cportal_c2", "cportal_c3", "cportal_c4"]
forbidden_modules = ["cportal_connectors", "cportal_sim", "cportal_api", "cportal_worker"]

[[tool.importlinter.contracts]]
name = "nexus uses capability services, never the generators, connectors or apps"
type = "forbidden"
source_modules = ["cportal_nexus"]
forbidden_modules = ["cportal_connectors", "cportal_sim", "cportal_api", "cportal_worker"]

[[tool.importlinter.contracts]]
name = "capability packages are independent of each other"
type = "independence"
modules = ["cportal_c1", "cportal_c2", "cportal_c3", "cportal_c4"]

[[tool.importlinter.contracts]]
name = "the API reads the database, never the generators or connectors"
type = "forbidden"
source_modules = ["cportal_api"]
forbidden_modules = ["cportal_sim", "cportal_connectors"]
