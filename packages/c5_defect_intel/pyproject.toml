[project]
name = "cportal-c5"
version = "0.1.0"
description = "C5 defect intelligence: zero- and few-shot anomaly detection on DINOv2 patches (ONNX, CPU), ISO 2859-1 AQL lots, defective-batch risk, SPC and orders-at-risk impact"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cportal-core",
    "httpx>=0.27",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.scripts]
c5 = "cportal_c5.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cportal_c5"
