# Disruption priors by type (C2 §5.6, 08 §4): severity 0–1, duration P50/P90 in hours, and how
# much of a node's capacity the event removes while it lasts. ESTIMATES from the brief's
# examples and Bangladesh press patterns (hartals 1–3 days, cyclone port closures 1–2 days,
# Red Sea diversions weeks); C2's backtests refine them. Shown as assumptions in the UI.
version: 1
types:
  PORT_OPERATIONS_SUSPENDED: {severity: 0.8, p50_h: 36,  p90_h: 72,   capacity_pct: 0}
  PORT_CONGESTION:           {severity: 0.5, p50_h: 120, p90_h: 336,  capacity_pct: 60}
  LABOR_STRIKE_BLOCKADE:     {severity: 0.7, p50_h: 48,  p90_h: 120,  capacity_pct: 20}
  CYCLONE_STORM:             {severity: 0.8, p50_h: 48,  p90_h: 96,   capacity_pct: 0}
  FLOOD:                     {severity: 0.6, p50_h: 96,  p90_h: 240,  capacity_pct: 50}
  EARTHQUAKE_OTHER_NATURAL:  {severity: 0.6, p50_h: 72,  p90_h: 336,  capacity_pct: 40}
  FIRE_EXPLOSION:            {severity: 0.6, p50_h: 168, p90_h: 720,  capacity_pct: 0}
  CHOKEPOINT_DISRUPTION:     {severity: 0.6, p50_h: 720, p90_h: 2160, capacity_pct: 80}
  SECURITY_CONFLICT_PIRACY:  {severity: 0.5, p50_h: 72,  p90_h: 336,  capacity_pct: 60}
  CUSTOMS_SYSTEM_REGULATORY: {severity: 0.5, p50_h: 24,  p90_h: 72,   capacity_pct: 40}
  TRADE_POLICY_SANCTION:     {severity: 0.4, p50_h: 2160, p90_h: 8760, capacity_pct: 90}
  ENERGY_UTILITY_SHORTAGE:   {severity: 0.5, p50_h: 72,  p90_h: 336,  capacity_pct: 60}
  CYBER_INCIDENT:            {severity: 0.6, p50_h: 48,  p90_h: 168,  capacity_pct: 30}
  CARRIER_CAPACITY_RATES:    {severity: 0.3, p50_h: 720, p90_h: 2160, capacity_pct: 90}
  INLAND_TRANSPORT_DISRUPTION: {severity: 0.5, p50_h: 48, p90_h: 120, capacity_pct: 40}
  PHARMA_REGULATORY_QUALITY: {severity: 0.6, p50_h: 2160, p90_h: 8760, capacity_pct: 0}
  SUPPLIER_INCIDENT:         {severity: 0.6, p50_h: 120, p90_h: 336,  capacity_pct: 30}
  DEMAND_SHOCK:              {severity: 0.4, p50_h: 720, p90_h: 2160, capacity_pct: 100}
  OTHER:                     {severity: 0.3, p50_h: 48,  p90_h: 168,  capacity_pct: 80}
# Reliability of a single source when corroborating (0–1, estimates).
source_reliability: {DS-NEWS-02: 0.4, DS-NEWS-03: 0.6, DS-NEWS-04: 0.8, DS-WX-02: 0.9, DS-PHARMA-01: 0.9, default: 0.5}
single_source_cap: 0.5     # C2 §11: confidence without corroboration
alert: {min_severity: 0.5, min_confidence: 0.35}
# Facility-type events in a district link to the scenario's facilities there (C1 links).
area_types: [FLOOD, CYCLONE_STORM, LABOR_STRIKE_BLOCKADE, ENERGY_UTILITY_SHORTAGE, EARTHQUAKE_OTHER_NATURAL, INLAND_TRANSPORT_DISRUPTION]
