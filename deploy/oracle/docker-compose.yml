# Production backend on an Oracle Cloud Always Free VM (A-119): API + worker + Caddy (HTTPS).
# The database is Neon (DATABASE_URL in .env.prod); the website is on Vercel and calls this API
# server-side with API_TOKEN. Run by scripts/deploy_oracle.sh from /opt/cportal on the VM.
x-app: &app
  image: cportal-app:latest
  env_file: .env.prod
  environment:
    CPORTAL_ROOT: /app
    CPORTAL_LLM: "0"          # no local LLM on the VM; C2 uses its rules and GLiNER path
  volumes:
    - ./.env.prod:/app/.env:ro                       # server-side keys (settings aliases)
    - ./data/c5:/app/data/c5
    - ./models/c5:/app/models/c5:ro
    - ./data/cache:/app/data/cache
    - ./data/raw:/app/data/raw                       # CPA raw archive, GFW cache
  restart: unless-stopped

services:
  migrate:
    <<: *app
    build: {context: ., dockerfile: Dockerfile}
    command: ["uv", "run", "--no-sync", "alembic", "-c", "db/alembic.ini", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["uv", "run", "--no-sync", "uvicorn", "cportal_api.main:app", "--host", "0.0.0.0",
              "--port", "8000", "--proxy-headers", "--workers", "2"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["uv", "run", "--no-sync", "cportal-worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env.prod
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

volumes:
  caddy_data: {}
