# Garments (RMG) industry pack: the demo's hero (Q-08). Products carry real HS 2022 codes;
# quantities, lead times and defect rates are ESTIMATES for the synthetic world, marked as such,
# until C1/C5 calibrate them (Comtrade mirror flows, AQL norms, dataset defect ratios).
version: 1
industry: garments
products:
  # finished goods
  TSHIRT:        {name: "Men's knitted cotton T-shirt", hs6: "610910", uom: pcs, unit_value_usd: 3.2}
  POLO:          {name: "Knitted cotton polo shirt", hs6: "610510", uom: pcs, unit_value_usd: 5.6}
  DENIM_TROUSER: {name: "Men's cotton denim trousers", hs6: "620342", uom: pcs, unit_value_usd: 9.8}
  SWEATER:       {name: "Cotton pullover sweater", hs6: "611020", uom: pcs, unit_value_usd: 7.4}
  # materials and trims
  KNIT_FABRIC:   {name: "Dyed knitted cotton fabric", hs6: "600622", uom: kg, unit_value_usd: 4.1}
  DENIM_FABRIC:  {name: "Cotton denim fabric", hs6: "520942", uom: m, unit_value_usd: 3.3}
  COTTON_YARN:   {name: "Combed cotton yarn", hs6: "520512", uom: kg, unit_value_usd: 3.0}
  RAW_COTTON:    {name: "Raw cotton, not carded", hs6: "520100", uom: kg, unit_value_usd: 1.9}
  BUTTON:        {name: "Plastic buttons", hs6: "960621", uom: pcs, unit_value_usd: 0.01}
  ZIPPER:        {name: "Metal slide fasteners", hs6: "960711", uom: pcs, unit_value_usd: 0.12}
  LABEL:         {name: "Woven labels", hs6: "580710", uom: pcs, unit_value_usd: 0.02}
  CARTON:        {name: "Corrugated cartons", hs6: "481910", uom: pcs, unit_value_usd: 0.6}
bom:  # parent: {component: qty per unit (estimate)}
  TSHIRT:        {KNIT_FABRIC: 0.22, LABEL: 2, CARTON: 0.02}
  POLO:          {KNIT_FABRIC: 0.30, BUTTON: 3, LABEL: 2, CARTON: 0.025}
  DENIM_TROUSER: {DENIM_FABRIC: 1.35, BUTTON: 1, ZIPPER: 1, LABEL: 3, CARTON: 0.05}
  SWEATER:       {COTTON_YARN: 0.45, LABEL: 2, CARTON: 0.03}
  KNIT_FABRIC:   {COTTON_YARN: 1.08}
  DENIM_FABRIC:  {COTTON_YARN: 0.55}
  COTTON_YARN:   {RAW_COTTON: 1.12}
# Supply network template. `count` facilities of each type; clusters are picked round-robin.
# `orgs`: how many supplier groups own those facilities (facility i belongs to group
# (i - 1) % orgs + 1); `makers`: how many exporters own the factories. Sized for C1-AC01
# (≥ 150 nodes, ≥ 600 edges); counts are a slice of the corridor, not the whole industry.
makers: 10
facilities:
  garment_factory: {count: 66, clusters: [gazipur, dhaka_epz, narayanganj, cepz, kepz, adamjee_epz, savar, tongi], makes: [TSHIRT, POLO, DENIM_TROUSER, SWEATER]}
  fabric_mill:     {count: 22, orgs: 10, clusters: [gazipur, narayanganj, savar, tongi, gazipur, narayanganj, bhaluka, savar], makes: [KNIT_FABRIC, DENIM_FABRIC]}
  spinning_mill:   {count: 8,  orgs: 5, clusters: [bhaluka, bhaluka, gazipur, narayanganj], makes: [COTTON_YARN]}
  trims_supplier:  {count: 16, orgs: 8, clusters: [dhaka_epz, cepz, gazipur, narayanganj], makes: [BUTTON, ZIPPER, LABEL, CARTON]}
  overseas:        # imported inputs: city → products (sea via the listed hub)
    - {city: ahmedabad, makes: [RAW_COTTON, COTTON_YARN], via: [LKCMB], transit_d: [12, 18]}
    - {city: memphis,   makes: [RAW_COTTON],             via: [SGSIN], transit_d: [38, 50]}
    - {city: shaoxing,  makes: [KNIT_FABRIC, DENIM_FABRIC, ZIPPER], via: [SGSIN], transit_d: [16, 24]}
    - {city: kolkata,   makes: [COTTON_YARN],            via: [],      transit_d: [5, 9]}
# Planted single points of failure (C1-AC02): each listed facility is the only qualified source
# of the product for every consumer. C1 must rank them in its top 10 without being told.
planted_spofs:
  - {product: DENIM_FABRIC, facility: fabric_mill_3.fabric_mill.3, why: "Fabric Mill X: sole denim source (golden path, 01 §5)"}
  - {product: ZIPPER, facility: trims_supplier_2.trims_supplier.2, why: "sole qualified zipper source"}
buyers:  # fictional brands; DCs near real gateway cities
  - {city: rotterdam,   gateway: NLRTM, via: [SGSIN], products: [TSHIRT, POLO, SWEATER]}
  - {city: rotterdam,   gateway: NLRTM, via: [LKCMB], products: [DENIM_TROUSER, TSHIRT]}
  - {city: los_angeles, gateway: USLAX, via: [SGSIN], products: [TSHIRT, DENIM_TROUSER]}
  - {city: los_angeles, gateway: USLAX, via: [MYPKG], products: [POLO, SWEATER]}
  - {city: rotterdam,   gateway: NLRTM, via: [SGSIN], products: [DENIM_TROUSER, POLO]}
  - {city: rotterdam,   gateway: NLRTM, via: [LKCMB], products: [SWEATER, TSHIRT]}
  - {city: los_angeles, gateway: USLAX, via: [SGSIN], products: [TSHIRT, POLO]}
  - {city: los_angeles, gateway: USLAX, via: [MYPKG], products: [DENIM_TROUSER, SWEATER]}
lead_time_d:  # supplier order-to-delivery, mean and sd (estimates)
  domestic: {mean: 21, sd: 5}
  imported: {mean: 35, sd: 8}
orders:
  per_buyer_per_month: 4
  qty_pcs: [20000, 120000]
  horizon_d: 120
defects:  # Beta(a, b) per supplier facility type, for incoming-material inspection (estimates)
  fabric_mill: {a: 2.0, b: 60.0}
  overseas:    {a: 1.5, b: 70.0}
  trims_supplier: {a: 1.0, b: 150.0}

# Finished-goods lots at final QC (C5). Estimates, tuned so ≈ 10 % of lots fail AQL 2.5 with the
# model's recall: ≈ 2 % major defects on a typical line; lots of 1,201–3,200 pieces take code
# letter K (n = 125, Ac 7).
production:
  factories: 10            # the hero factory plus the busiest others
  lines: 3
  history_days: 60
  gap_days: [2, 4]
  lot_units: [1201, 3200]
  base_rate: 0.022
  plant_sd: 0.3
  line_sd: 0.25
  lot_sd: 0.4
  night_shift: 0.2         # log-odds added on shift B
  drift: {days: 12, factor: 4.0}
