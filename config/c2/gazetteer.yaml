# the place makes an article relevant (1 = the corridor itself). `cluster` ties a place to the
# synthetic world's facility clusters (C1 links). Aliases are matched case-insensitively on word
# boundaries; keep spellings (Chittagong/Chattogram/Ctg) here, not in code.
