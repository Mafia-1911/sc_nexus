[project]
name = "cportal-core"
version = "0.1.0"
description = "Shared kernel: settings, paths, areas, enums, ids, ORM models, canonical schemas, lineage, outbox"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "geoalchemy2>=0.16",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
