# Source registry: what code needs at runtime (mode, credentials, politeness, fallback).
# The narrative per source (limits, licence, coverage, quirks) is in docs/data-sources/<DS-ID>.md,
# generated from docs/data-sources/cards.yaml plus the latest probe run.
#
# status:   verified | needs-registration | blocked | manual | paid-excluded | deprecated | unprobed
#           (`manual` extends the brief's list: a human-maintained table with cited sources)
# mode:     live | replay | synthetic | off   (default for M2; 02-architecture.md §8)
# fallback: what serves the same schema when the source fails twice (two-strikes rule, A-012)
# min_interval_s: the harness's token bucket; never below a documented limit.
version: 1
sources:
  # 2.1 Maritime and AIS --------------------------------------------------------------------
  DS-AIS-01: {name: aisstream.io live AIS, tier: P0, status: verified, mode: synthetic, fallback: synthetic, used_by: [C4, NX], auth: api-key, env: [AISSTREAM_API_KEY], protocol: WebSocket, base_url: "wss://stream.aisstream.io/v0/stream", min_interval_s: 1, bd_coverage: none}
  DS-AIS-02: {name: Global Fishing Watch API v3, tier: P0, status: verified, mode: replay, fallback: synthetic, used_by: [C4, C2, NX], auth: bearer-token, env: [GFW_API_TOKEN], protocol: REST, base_url: "https://gateway.api.globalfishingwatch.org/v3", min_interval_s: 1, nc: true}
  DS-AIS-03: {name: Danish Maritime Authority historical AIS, tier: P1, status: blocked, mode: off, fallback: DS-AIS-04, used_by: [C4], auth: none, protocol: file-download, base_url: "http://aisdata.ais.dk/", min_interval_s: 2}
  DS-AIS-04: {name: NOAA MarineCadastre AIS (US waters), tier: P1, status: blocked, mode: off, fallback: synthetic, used_by: [C4], auth: none, protocol: file-download, min_interval_s: 2}
