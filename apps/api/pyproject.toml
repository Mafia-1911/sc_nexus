[project]
name = "cportal-api"
version = "0.1.0"
description = "FastAPI app: /api/v1 REST + /ws/live (02 §3); reads only, heavy work via jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cportal-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
cportal-api-openapi = "cportal_api.openapi:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
