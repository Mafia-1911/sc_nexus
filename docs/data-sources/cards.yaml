# Narrative facts for each source card (template: docs/brief/03-data-sources.md §1).
# `uv run probe --card <DS-ID>` renders docs/data-sources/<DS-ID>.md from this file,
# config/sources.yaml and the latest probe run. Edit here, not in the generated cards.
# Measured numbers come from the M0 probes of 2026-10-25/26 UTC.

DS-AIS-01:
  signup: https://aisstream.io/authenticate (keys under https://aisstream.io/account)
  pagination: none (push stream)
  limits_documented: 3 subscribed connections per account and per IP; subscription within 3 s; ≤ 1 subscription update/s; ≤ 200 MMSI filters; no SLA, no replay; uncompressed connections bandwidth-limited from Sep 2026 (use permessage-deflate)
  limits_observed: worldwide PositionReport stream ≈ 44 msg/s; server confirms with {"MessageType":"SubscriptionConfirmation","Message":{"CompressionEnabled":true}}
  licence: No terms page found (only /privacypolicy). Redistribution rights unclear, so only 5 frames per message type are committed, as format fixtures.
  attribution: "AIS data: aisstream.io"
  nc: unknown
  freshness: real time (seconds) where receivers exist
  history: none (persist on arrival)
  cadence: push
  bd_coverage: "**None.** 0 messages in 10 min over the Bay of Bengal approach box (88.0–92.5 E, 19.5–22.5 N) and 0 in about 50 min of collector runtime (two runs, 2026-10-25 22:55–23:40 UTC), while the same key streamed 44 msg/s worldwide."
  failure_modes: invalid key → the server drops the connection with no close frame and no error JSON (≈ 1.3 s); idle box → only the confirmation frame arrives
  quirks: MetaData.MMSI_String is an integer; ShipName padded to 20 chars; time_utc in Go format ("2026-10-25 22:59:34.035581545 +0000 UTC"); sentinels Cog 360, TrueHeading 511, RateOfTurn -128; ShipStaticData Destination contains '@' padding and junk; Eta has no year; ImoNumber/MaximumStaticDraught 0 = unknown
  mapping: ais_position(mmsi ← MetaData.MMSI, ts ← parse(MetaData.time_utc), received_at ← collector clock, lon/lat ← Message.*.Longitude/Latitude, sog_kn ← Sog (102.3→null), cog_deg ← Cog (360→null), heading_deg ← TrueHeading (511→null), nav_status ← NavigationalStatus); vessel(name, callsign, ship_type_ais ← ShipStaticData)
  synthetic_twin: "`uv run ais-synth`: frames in exactly this format for Chattogram, fictional vessels (MID 999, names 'SYN …'), Poisson arrivals from PortWatch (3.62 container, 1.22 tanker, 0.61 bulk, 0.50 general, 0.07 ro-ro per day), anchorage cells and berth cells from GFW, ground-truth port calls. 7-day baseline: 78 visits, 200,975 frames, dwell p50 81.8 h vs GFW 83 h; p90 182 h vs 276 h (thin tail); 29–36 vessels/day in the anchorage vs 57–81 GFW cargo (no lighters/coasters yet)."
  next: Keep `make collect-ais` running anywhere it can (coverage may appear); M1 replaces the visit planner with the SimPy port DES and adds a lighter/coaster fleet.

DS-AIS-02:
  signup: https://globalfishingwatch.org/our-apis/tokens (free, non-commercial; ≤ 5 tokens/account)
  pagination: offset/limit with `nextOffset`; limit tested at 1000
  limits_documented: '50,000 requests/day and 1,500,000/month across all tokens; exceeding blocks every token for 24 h / 30 days (HTTP 429). 4Wings: one report at a time (429), 524 after 100 s then fetch /4wings/last-report; date range ≤ 366 days'
  limits_observed: "headers x-ratelimit-daily-limit-requests: 50000, x-ratelimit-monthly-limit-requests: 1500000 (usage counters stayed 0)"
  licence: CC BY-NC 4.0; non-commercial use only
  attribution: '"Powered by Global Fishing Watch." linked to https://globalfishingwatch.org (or the dataset/date-range citation form on the licence page)'
  nc: true
  freshness: port visits and presence ≈ 2–4 days behind (latest presence day 2026-10-21, latest transmission 2026-10-23 when probed on 2026-10-26)
  history: port visits back to 2012+ (visits overlapping the window are returned, some starting 2014); presence 2012 → ~96 h ago
  cadence: daily
  bd_coverage: "**Strong.** 1,897 port visits at `bgd-chittagong` in 90 days (1,242 cargo, 1,662 at confidence 4); cargo port time (conf 4, < 60 d) p10 32 h, p50 83 h, p90 276 h. Outer anchorage presence: 80–128 vessels/day (57–81 cargo) over 40 days, with IMO, MMSI, name, flag, type, hours and speed."
  failure_modes: no or bad token → 401 {"error":"invalid token"}; unknown dataset → 404; offset past the end → 201 with empty entries; POST /events answers 201, not 200
  quirks: "timeFilterMode=OVERLAP returns visits that began years ago (one 12-year 'visit' at dock): filter by start date and duration. 1,142 of 1,159 cargo visits stop only at anchor cells (lighterage), so the start/intermediate/end anchorage `atDock` flags matter. Flags are ISO3. vessel.ssvid is the MMSI as a string."
  mapping: port_call(method='gfw', gfw_visit_id ← port_visit.visitId, arrival_ts ← start, departure_ts ← end, dwell_h ← port_visit.durationHrs, confidence ← port_visit.confidence, stops ← start/intermediate/endAnchorage{anchorageId, atDock, lat, lon}); vessel_identity(gfw_vessel_id ← vessel.id, mmsi ← vessel.ssvid, flag_iso3); zone_presence_daily ← 4Wings presence rows
  synthetic_twin: the DS-AIS-01 twin's ground-truth port calls use the same fields; M1 DES calibrates to these quantiles
  next: label store for C4 (point-in-time); hourly presence at HIGH resolution to segment anchorage wait vs berth time

