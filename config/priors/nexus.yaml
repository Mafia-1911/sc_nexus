# Nexus layer priors (docs/brief/08-nexus-layer.md). Estimates unless a source is named (A-092).
version: 1
door_eta:
  samples: 1000
  seed: 42
  gateway: BDCGP
  # Only events that stop cargo hold shipments: types with capacity_pct ≤ this in
  # disruptions.yaml (port suspension, cyclone, fire, strike). Partial capacity: later.
  hold_max_capacity_pct: 20
  vessel_window_days: 60   # pool C4 port_call predictions (Chattogram) from C4's last 60 days
  # Yard + customs dwell at Chattogram. P50 = c1.yaml gateway_dwell (4 d, estimate); P90 = 2×
  # P50 (estimate). Replace with a dated, reported Chattogram average when one is found.
  container_dwell_h: {p50: 96, p90: 192}
  # Lognormal σ of moving time by mode (median = plan). Estimates: rail is the least reliable
  # (C3: 35 % slot cancellations), sea liner legs the most.
  leg_sigma: {road: 0.25, rail: 0.35, barge: 0.30, sea: 0.12, air: 0.10}
# Scenario Studio (08 §2, NX-AC05): "with Nexus vs without" (A-097). Estimates unless sourced.
studio:
  penalty_rate: 0.15          # lateness cost as a share of order value (same as buffer.py)
  # Inland legs: great-circle km × detour (road/rail/barge vs straight line; C3's road graph is
  # within 3.2 % of ORS, but legs here are not routed), DESNZ factors via C3 (`c3 store.factors`).
  detour: {road: 1.3, rail: 1.2, barge: 1.25}
  # Air instead of sea for C5's `expedite_air`, BD → EU (DESNZ 2026 rows, kg CO2e / tonne.km).
  air: {vehicle_class: "Freight flights / International, to/from non-UK", fuel: "With RF", km: 7500}
  sea: {vehicle_class: "Cargo ship / Container ship / Average", km: 14500}
# Reroute exports via the alternative gateway when Chattogram blocks them (cause "gateway" in C1's
# cascade). ESTIMATES (A-098): Mongla's feeder frequency and box capacity limit the share that can
# move; extra cost = longer feeder connection and handling; replace with dated quotes.
reroute:
  alt_gateway: BDMGL
  alt_name: Mongla
  feasible_share: 0.6
  extra_usd_per_teu: 250
  extra_days: 2
  units_per_teu: 8000        # garments per TEU (estimate)
# Backtest "time machine" (08 §6, NX-AC06; A-099). Ground truth = disruption episodes in real GFW
# port calls at the gateway; alerts = hazard-feed events the Nexus alert rule would have raised,
# at the time they became available. Thresholds are choices, not tuned to the result.
backtest:
  locode: BDCGP
  centre: {lat: 22.3, lon: 91.8}     # Chattogram
  start: "2023-01-01"
  history_days: 14                   # trailing window for the "normal" daily departures
  drop_ratio: 0.5                    # a day is disrupted at ≤ 50 % of the trailing median
  min_median: 5                      # skip days whose normal is this thin
  merge_gap_days: 1                  # disrupted days this close form one episode
  alert_max_km: 300                  # hazard centroid within this of the gateway, or its LOCODE
  max_age_days: 10                   # an alert is a current hazard: start ≤ 10 days before it is known
  context_hazard_days: 7             # label misses with any hazard that began up to 7 days before
  match_before_days: 1               # an episode starting 1 day before …
  match_after_days: 7                # … to 7 days after an alert matches it
  # Context labels for misses only (never used to score). Eid dates in Bangladesh, ±1 day;
  # the July–August 2024 unrest (internet shutdown from 18 July; government fell 5 August).
  context:
    - {label: "Eid al-Fitr", date: "2023-04-22", before: 3, after: 7}
    - {label: "Eid al-Adha", date: "2023-06-29", before: 3, after: 7}
    - {label: "Eid al-Fitr", date: "2024-04-11", before: 3, after: 7}
    - {label: "Eid al-Adha", date: "2024-06-17", before: 3, after: 7}
    - {label: "Eid al-Fitr", date: "2025-03-31", before: 3, after: 7}
    - {label: "Eid al-Adha", date: "2025-06-07", before: 3, after: 7}
    - {label: "Eid al-Fitr", date: "2026-03-21", before: 3, after: 7}
    - {label: "Eid al-Adha", date: "2026-05-27", before: 3, after: 7}
    - {label: "July–August 2024 unrest", date: "2024-07-18", before: 0, after: 19}
