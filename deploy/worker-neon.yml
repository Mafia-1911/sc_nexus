# The worker against the cloud database (A-120): `make worker-cloud`. Live polling (CPA, news,
# hazards) and model refreshes write to Neon, which the deployed API reads. Uses
# NEON_DATABASE_URL from .env; the local API and web keep the local database.
services:
  worker:
    environment:
      DATABASE_URL: ${DATABASE_URL_UNPOOLED:?set DATABASE_URL_UNPOOLED (Neon direct URL) in .env}
      CPORTAL_LLM: "0"
