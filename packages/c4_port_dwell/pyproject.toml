[project]
name = "cportal-c4"
version = "0.1.0"
description = "C4 port dwell: port-call labels, point-in-time features, median and LightGBM quantile dwell with conformal intervals, remaining-wait survival, queue forecasts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cportal-core",
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "mapie>=1.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scikit-survival>=0.23",
]

[project.scripts]
c4 = "cportal_c4.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cportal_c4"
